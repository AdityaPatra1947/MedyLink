name: medylink
services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PRIVATE_MEDIA_ROOT: /app/private-media
    volumes:
      - evidence:/app/private-media
    depends_on:
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  evidence:
    name: ${MEDYLINK_EVIDENCE_VOLUME:-arogyatrack-lite_evidence}
